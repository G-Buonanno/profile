name: Update publications from Scopus

on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday, 05:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the refreshed index.html

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch from Scopus and rewrite index.html
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}   # optional
          SCOPUS_AUTHOR_ID: "7006985475"
        run: python scripts/update_publications.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update publications from Scopus ($(date -u +%F))"
            git push
          fi
